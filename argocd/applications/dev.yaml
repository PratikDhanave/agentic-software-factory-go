apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factory-dev
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/PratikDhanave/agentic-software-factory-go.git
    targetRevision: main
    path: config/dev
  
  destination:
    server: https://kubernetes.default.svc
    namespace: factory-dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
