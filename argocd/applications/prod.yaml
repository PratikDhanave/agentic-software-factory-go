apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factory-prod
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/PratikDhanave/agentic-software-factory-go.git
    targetRevision: v1.0.0
    path: config/prod
  
  destination:
    server: https://kubernetes.default.svc
    namespace: factory-prod
  
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
