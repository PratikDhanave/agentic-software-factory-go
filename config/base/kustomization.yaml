apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: factory-system

commonLabels:
  app: agentic-factory
  managed-by: kustomize

resources:
  - ./rbac.yaml

configMapGenerator:
  - name: factory-config
    literals:
      - environment=base
      - version=1.0.0
      - log_level=info
