version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: asf-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asf-network

networks:
  asf-network:
    driver: bridge

volumes:
  postgres_data:
