version: '3.8'

services:
  factory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-factory
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ADDR: ":8080"
    volumes:
      - factory-data:/data
      - ./.asf:/app/.asf
    networks:
      - factory-net
    healthcheck:
      test: ["CMD", "/app/asf", "help"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  factory-net:
    driver: bridge

volumes:
  factory-data:
    driver: local
