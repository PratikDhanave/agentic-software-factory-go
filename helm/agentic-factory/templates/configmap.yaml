apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-factory.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-factory.labels" . | nindent 4 }}
data:
  app.conf: |
    [app]
    version = {{ .Chart.AppVersion }}
    environment = {{ .Release.Namespace }}
